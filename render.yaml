# PharmaSafe Infrastructure Blueprint for Render
# Declarative multi-service configuration for Spring Boot backend and React Vite frontend.
# Reference: https://render.com/docs/blueprint-spec

services:
  # =========================================================================
  # 1. Backend Web Service (Spring Boot 3.3.4, Java 17, Docker)
  # =========================================================================
  - type: web
    name: pharmasafe-backend
    env: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: DB_HOST
        sync: false
        # Supabase Session Pooler (IPv4): aws-0-<region>.pooler.supabase.com
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USERNAME
        sync: false
        # Pooler format: postgres.<project-ref> (or postgres for direct if IPv4 is routed)
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_QUERY
        value: "?sslmode=require"
      - key: COOKIE_SAME_SITE
        value: None
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
        # Example: https://pharmasafe-frontend.onrender.com
      - key: HIKARI_MAX_POOL_SIZE
        value: 5
      - key: FLYWAY_ENABLED
        value: "true"
      - key: JAVA_OPTS
        value: "-Xms256m -Xmx384m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
      - key: INIT_ADMIN_USERNAME
        sync: false
        # Initial administrator username (e.g. sysadmin)
      - key: INIT_ADMIN_PASSWORD
        sync: false
        # Initial administrator secure password (min 8 chars)

  # =========================================================================
  # 2. Frontend Static Site (React 19, TypeScript, Vite)
  # =========================================================================
  - type: web
    name: pharmasafe-frontend
    env: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
        # Example: https://pharmasafe-backend.onrender.com
