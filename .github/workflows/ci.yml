name: PharmaSafe CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      trigger_deploy:
        description: 'Explicitly approve and trigger Render deployment (yes/no)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

jobs:
  # ==========================================
  # Frontend Quality Gate
  # ==========================================
  frontend-ci:
    name: Frontend Verification & Build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify shared field validation rules
        run: |
          node ../scripts/verify-input-rules.mjs
          node ../scripts/verify-public-role-catalog.mjs

      - name: Run Frontend Tests (Vitest)
        run: npm test -- --run

      - name: Build Production Frontend
        run: npm run build

      - name: Archive Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ==========================================
  # Backend Quality Gate
  # ==========================================
  backend-ci:
    name: Backend Test & Packaging
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Backend Tests
        run: mvn -B clean test

      - name: Archive synthetic PDF layout samples
        uses: actions/upload-artifact@v4
        with:
          name: case-pdf-previews
          path: backend/target/qa-pdfs/*.pdf
          retention-days: 7

      - name: Setup Node.js for integration verification
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify PostgreSQL migration integrity
        working-directory: .
        run: |
          npm install --prefix "$RUNNER_TEMP/pv-migrations" --no-audit --no-fund @electric-sql/pglite@0.3.14
          node scripts/verify-workspace-migration.mjs "$RUNNER_TEMP/pv-migrations"

      - name: Verify seven-role browser workflow
        working-directory: .
        run: |
          npm ci --prefix frontend
          npm ci --prefix scripts/qa
          npx --prefix scripts/qa playwright install --with-deps chromium
          node scripts/verify-role-workflow.cjs

      - name: Archive workspace preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-previews
          path: /tmp/pharmasafe-ui-qa-*/screens/*.png
          retention-days: 7

      - name: Package Executable JAR
        run: mvn -B package -DskipTests

      - name: Archive Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/pharmasafe-backend-0.0.1-SNAPSHOT.jar
          retention-days: 7

  deploy:
    name: Deploy and verify Render production
    needs: [frontend-ci, backend-ci]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.trigger_deploy == 'yes'))
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    concurrency:
      group: pharmasafe-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deploy backend, verify migration readiness, then deploy frontend
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
          RENDER_BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
          RENDER_FRONTEND_URL: ${{ vars.RENDER_FRONTEND_URL }}
        run: node scripts/deploy-render.mjs
