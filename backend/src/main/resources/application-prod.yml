# PharmaSafe Production Profile
# Active when SPRING_PROFILES_ACTIVE=prod
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: ${COOKIE_SAME_SITE:None}
        secure: ${COOKIE_SECURE:true}

spring:
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      connection-timeout: 15000
      idle-timeout: 120000
      max-lifetime: 600000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.pharmasafe: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
